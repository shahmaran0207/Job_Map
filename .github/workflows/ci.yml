name: ci

# 시크릿이 필요 없는 검증만 여기 둔다. 그래서 Dependabot PR 에서도 그대로 돌아간다.
# 의존성 업그레이드가 파싱 동작을 조용히 바꾸는 것을 막는 것이 이 워크플로의 존재 이유다.
# (fast-xml-parser 4.x -> 5.x 같은 메이저 업그레이드가 검증 없이 머지되는 사고 방지)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 설치 스크립트를 실행하지 않는다. 의존성 하나가 오염되면 CI 가 유출 경로가 된다.
      - run: npm ci --ignore-scripts

      - name: 타입 검사
        run: npm run typecheck

      - name: 응답 파싱 회귀 테스트
        run: npm run test:parse

      - name: 실거래가 파싱 회귀 테스트
        run: npm run test:molit

      # 웹 빌드도 게이트에 넣는다. Dependabot 이 typescript 7 을 올렸을 때
      # next.config.ts 로드가 깨졌는데 타입 검사만으로는 잡히지 않았다.
      - name: 웹 빌드
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # 빌드는 DB 에 접속하지 않는다. 라우트는 force-dynamic 이라
          # 프리렌더 단계에서 쿼리가 실행되지 않는다.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DATABASE_SSL: disable
