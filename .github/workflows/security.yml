name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * 1' # 매주 월요일 KST 03:00

permissions:
  contents: read

jobs:
  audit:
    name: 의존성 취약점
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts # 설치 스크립트 실행 차단 (공급망 방어)
      - name: npm audit
        run: npm audit --audit-level=high
      # 타입 검사와 파싱 회귀 테스트는 ci.yml 로 옮겼다. 이 워크플로는 보안 검사만 담당한다.

  secrets:
    name: 비밀값 유출 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리를 훑어 과거 커밋에 남은 키까지 잡는다
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: 정적 분석
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # init 과 analyze 는 반드시 같은 메이저 버전이어야 한다. 섞이면
      # "Loaded a configuration file for version '3.x', but running version '4.x'"
      # 로 실패한다. Dependabot 이 v4 스텝을 추가하면서 v3 스텝을 지우지 않아
      # init 이 두 번 돌던 상태를 정리했다.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # 보안 쿼리를 확장 세트로 돌린다 (기본보다 SSRF/인젝션 커버리지가 넓다)
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
