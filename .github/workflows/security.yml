name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * 1' # 매주 월요일 KST 03:00

permissions:
  contents: read

jobs:
  audit:
    name: 의존성 취약점
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts # 설치 스크립트 실행 차단 (공급망 방어)
      - name: npm audit
        # registry.npmjs.org 의 audit 엔드포인트가 가끔 503/400 을 던지고
        # 한 번 그러면 5~7분씩 물고 있다가 실패한다(코드 문제가 아니라 npm
        # 쪽 이슈 — 실제로 여러 번 재현됨, npm 자체도 이 엔드포인트가
        # retire 예정이라는 notice 를 띄운다). 재시도 + 시도당 타임아웃으로
        # 한 번의 일시 장애가 12분짜리 CI 실패로 번지지 않게 한다.
        run: |
          for i in 1 2 3; do
            timeout 90 npm audit --audit-level=high && exit 0
            echo "npm audit 실패, 재시도 ($i/3)"
            sleep 5
          done
          exit 1
      # 타입 검사와 파싱 회귀 테스트는 ci.yml 로 옮겼다. 이 워크플로는 보안 검사만 담당한다.

  secrets:
    name: 비밀값 유출 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리를 훑어 과거 커밋에 남은 키까지 잡는다
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: 정적 분석
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # init 과 analyze 는 반드시 같은 메이저 버전이어야 한다. 섞이면
      # "Loaded a configuration file for version '3.x', but running version '4.x'"
      # 로 실패한다. Dependabot 이 v4 스텝을 추가하면서 v3 스텝을 지우지 않아
      # init 이 두 번 돌던 상태를 정리했다.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # 보안 쿼리를 확장 세트로 돌린다 (기본보다 SSRF/인젝션 커버리지가 넓다)
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
