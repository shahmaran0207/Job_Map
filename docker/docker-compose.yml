# 라우팅 엔진 스택.
#
# 보안상 가장 중요한 사실: Valhalla 와 OTP2 에는 인증 기능이 전혀 없다.
# 포트를 그대로 노출하면 URL 을 아는 누구나 무제한으로 경로 계산을 시킬 수 있고,
# 그것은 곧 이 PC 의 CPU 를 태우는 무료 연산 서비스가 된다.
#
# 그래서 엔진 포트는 호스트에 바인딩하지 않고(127.0.0.1 도 아님, 아예 노출 안 함)
# 같은 도커 네트워크 안에서만 접근 가능하게 두고, 인증·레이트리밋을 하는
# nginx 프록시 하나만 로컬호스트에 노출한다. 외부 공개가 필요해지면
# Cloudflare Tunnel 이 이 프록시를 가리킨다.
#
# 방어 계층
#   1) Cloudflare Access (Zero Trust) — 터널 앞단. 무료 티어로 서비스 토큰 인증
#   2) nginx — Bearer 토큰 + 레이트리밋 + 경로 allowlist + 바디 크기 제한
#   3) 엔진 — 호스트에 노출되지 않음
#
# 실행 (저장소 루트에서)
#   npm run routing:up      기동
#   npm run routing:logs    진행 상황
#   npm run routing:down    정지
#
# 첫 기동은 오래 걸린다. Valhalla 가 한국 OSM 추출본(약 300MB)을 내려받고
# 타일을 빌드한다. 사양에 따라 15~40분. 완료 전까지 앱은 직선거리로 폴백한다.

name: jobmap-routing

services:
  routing-proxy:
    image: nginx:1.29-alpine
    ports:
      # 로컬호스트에만 바인딩한다. 0.0.0.0 은 같은 네트워크에 노출된다.
      - '127.0.0.1:8000:8000'
    environment:
      # 루트 .env 의 값. `--env-file .env` 로 주입된다.
      ROUTING_TOKEN: ${ROUTING_TOKEN:?ROUTING_TOKEN 을 .env 에 설정하세요 (openssl rand -hex 32)}
    volumes:
      - ./nginx/routing.conf.template:/etc/nginx/templates/routing.conf.template:ro
      - ./nginx/proxy_common.inc:/etc/nginx/snippets/proxy_common.inc:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # 도보 / 자차 라우팅.
  # gis-ops 이미지를 쓰는 이유: PBF 를 직접 내려받고 타일까지 빌드해준다.
  # 공식 valhalla 이미지는 빌드 단계를 수동으로 엮어야 한다.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    # ports 를 열지 않는다. 도커 내부 네트워크에서만 접근 가능.
    expose:
      - '8002'
    volumes:
      - ../data/valhalla:/custom_files
    environment:
      # 한국 전체 추출본. 최초 1회만 내려받는다.
      tile_urls: https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
      # 타일이 이미 있으면 PBF 를 다시 처리하지 않는다. 재기동이 빨라진다.
      use_tiles_ignore_pbf: 'True'
      force_rebuild: 'False'
      build_elevation: 'False' # 고도 데이터는 용량이 크고 통근 계산에 영향이 작다
      build_admins: 'True'
      build_time_zones: 'True'
      serve_tiles: 'True'
      server_threads: '4'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # 폭주하는 요청이 호스트 전체를 잡아먹지 않도록 상한을 건다.
          memory: 6g

  # 대중교통 라우팅. GTFS 확보가 선행되어야 하므로 기본 기동에서 제외한다.
  #   npm run routing:up:transit  로 함께 띄운다.
  # data/otp/ 에 국토부 표준 GTFS(zip)와 한국 OSM PBF 를 넣고 최초 1회
  # command 를 ['--build','--save'] 로 바꿔 그래프를 만든 뒤 '--load' 로 되돌린다.
  otp:
    profiles: ['transit']
    image: docker.io/opentripplanner/opentripplanner:2.5.0
    expose:
      - '8080'
    volumes:
      - ../data/otp:/var/opentripplanner
    command: ['--load', '--serve']
    environment:
      JAVA_TOOL_OPTIONS: '-Xmx12g'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 14g
